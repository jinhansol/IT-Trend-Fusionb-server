# 직무(진로) 데이터 초안 — 상태: UNVERIFIED, 사용자 검토 전. 서비스 데이터로 확정하지 않음.
#
# - 이 파일은 로더 반영 대상이 아닙니다 (CI·E2E는 backend/content/careers.yaml만 읽고, 그 파일은 아직 없습니다).
# - 설명·대표 업무·기술 연결은 AI(Claude)가 일반 지식으로 작성했고, 공식 자료와 대조하지 못했습니다.
#   작성 환경에서 O*NET(onetonline.org)·커리어넷(career.go.kr)에 접속할 수 없었습니다.
# - references의 링크도 열어 보지 못했습니다(UNVERIFIED). O*NET 직업 코드와 각 직무의 대응 관계도
#   검토가 필요합니다(특히 DevOps·데이터 엔지니어·ML 엔지니어는 O*NET에 정확히 같은 직업이 없음).
# - 연봉·채용 수요 같은 수치는 넣지 않습니다.
# - 형식 검증: 실제 technologies.yaml을 넣은 테스트 DB에서 `content_loader careers --dry-run` 통과.
#
# 확정 절차(제안): 근거 자료로 항목별 검토 → 수정 → backend/content/careers.yaml로 옮기는 별도 커밋.

roles:
  - slug: backend-developer
    name: 백엔드 개발자
    position: 1
    summary: 서비스의 서버 프로그램과 데이터베이스, 다른 프로그램이 쓰는 API를 만들고 운영합니다.
    description_md: |
      사용자가 직접 보지 않는 서버 쪽을 만듭니다. 화면(프론트엔드)이나 앱이 요청하면
      데이터를 저장·조회하고 결과를 돌려주는 프로그램, 그리고 그 데이터를 담는 데이터베이스를 설계합니다.

      서비스가 커지면 많은 요청을 안정적으로 처리하는 일, 장애를 찾아 고치는 일,
      보안 위협을 막는 일도 중요해집니다.
    tasks:
      - API 설계와 구현
      - 데이터베이스 모델링과 쿼리 작성
      - 인증·권한 처리
      - 테스트 작성과 배포
      - 장애 대응과 성능 개선
    technologies:
      core: [backend, python, java, database]
      related: [spring, django, fastapi, nodejs, postgresql, mysql, redis, docker, git]
    references:
      - title: "O*NET: Software Developers (15-1252.00) — UNVERIFIED, 링크·대응 미확인"
        url: https://www.onetonline.org/link/summary/15-1252.00

  - slug: frontend-developer
    name: 프론트엔드 개발자
    position: 2
    summary: 사용자가 브라우저에서 보고 조작하는 웹 화면을 만듭니다.
    description_md: |
      디자인을 실제로 동작하는 웹 화면으로 구현합니다. 버튼·입력·목록 같은 화면 요소를 만들고,
      서버의 API에서 데이터를 받아 보여 주며, 다양한 기기와 브라우저에서 잘 보이도록 다듬습니다.

      화면을 빠르게 그리는 일과 누구나 쓸 수 있게 하는 접근성도 중요한 업무입니다.
    tasks:
      - 웹 화면과 화면 요소(컴포넌트) 구현
      - 서버 API 연동
      - 여러 기기·브라우저 대응
      - 화면 성능과 접근성 개선
      - 디자이너·백엔드 개발자와 협업
    technologies:
      core: [frontend, javascript, typescript, react]
      related: [nextjs, vue, angular, svelte, graphql, git]
    references:
      - title: "O*NET: Web Developers (15-1254.00) — UNVERIFIED, 링크·대응 미확인"
        url: https://www.onetonline.org/link/summary/15-1254.00

  - slug: data-analyst
    name: 데이터 분석가
    position: 3
    summary: 데이터를 모으고 정리·분석해 의사결정에 필요한 근거를 만듭니다.
    description_md: |
      서비스나 업무에서 쌓인 데이터를 조회하고 정리해, 질문에 답할 수 있는 숫자와 그래프로 만듭니다.
      예를 들어 "어떤 기능을 쓴 사용자가 다시 방문하는가" 같은 질문을 데이터로 확인합니다.

      분석 결과를 다른 사람이 이해하도록 설명하는 일도 큰 비중을 차지합니다.
    tasks:
      - 데이터 조회(SQL)와 정리
      - 지표 정의와 대시보드 작성
      - 통계적 분석과 실험 결과 해석
      - 분석 결과 보고와 공유
    technologies:
      core: [data, python, database]
      related: [postgresql, mysql, spark]
    references:
      - title: "O*NET: Business Intelligence Analysts (15-2051.01) — UNVERIFIED, 링크·대응 미확인"
        url: https://www.onetonline.org/link/summary/15-2051.01

  - slug: data-engineer
    name: 데이터 엔지니어
    position: 4
    summary: 데이터가 모이고 저장되고 흐르는 길(파이프라인)을 만들고 운영합니다.
    description_md: |
      여러 곳에서 생기는 데이터를 모아 분석하기 좋은 형태로 바꾸고, 저장소에 안정적으로 쌓는
      시스템을 만듭니다. 데이터 분석가와 머신러닝 엔지니어가 믿고 쓸 수 있는 데이터를 준비하는 역할입니다.

      데이터 양이 많아지면 처리 속도, 비용, 장애 대응이 중요해집니다.
    tasks:
      - 데이터 수집·변환 파이프라인 구축
      - 데이터 저장소 설계
      - 대용량 데이터 처리 작업 운영
      - 데이터 품질 점검
    technologies:
      core: [data, python, database]
      related: [spark, kafka, postgresql, aws, gcp, docker]
    references:
      - title: "O*NET: Database Architects (15-1243.00) — UNVERIFIED, 링크·대응 미확인"
        url: https://www.onetonline.org/link/summary/15-1243.00

  - slug: devops-engineer
    name: DevOps·클라우드 엔지니어
    position: 5
    summary: 서비스를 빌드·배포·운영하는 환경과 자동화를 만들고, 클라우드 인프라를 관리합니다.
    description_md: |
      개발한 코드가 안정적으로 서비스되도록 서버·네트워크·클라우드 자원을 구성하고,
      테스트와 배포 과정을 자동화합니다. 장애를 빨리 알아차리기 위한 모니터링도 만듭니다.

      인프라를 코드로 관리하고, 비용과 보안을 함께 고려합니다.
    tasks:
      - 클라우드 인프라 구성과 관리
      - 빌드·테스트·배포 자동화(CI/CD)
      - 컨테이너 운영
      - 모니터링과 장애 대응
    technologies:
      core: [devops, cloud, linux, docker]
      related: [kubernetes, terraform, aws, azure, gcp, git]
    references:
      - title: "O*NET: Network and Computer Systems Administrators (15-1244.00) — UNVERIFIED, 대응이 정확하지 않을 수 있음"
        url: https://www.onetonline.org/link/summary/15-1244.00

  - slug: ml-engineer
    name: 머신러닝 엔지니어
    position: 6
    summary: 데이터로 학습한 모델을 만들고, 실제 서비스에서 쓸 수 있게 운영합니다.
    description_md: |
      문제에 맞는 머신러닝 모델을 고르고 데이터를 준비해 학습시키며, 결과를 평가합니다.
      좋은 모델을 만든 뒤에는 서비스에 붙여 실제 요청을 처리하도록 배포하고 성능을 계속 확인합니다.
    tasks:
      - 학습 데이터 준비와 모델 학습
      - 모델 평가와 개선
      - 모델 배포와 운영
      - 실험 기록과 재현
    technologies:
      core: [ai, python, pytorch]
      related: [tensorflow, llm, data, docker]
    references:
      - title: "O*NET: Data Scientists (15-2051.00) — UNVERIFIED, 대응이 정확하지 않을 수 있음"
        url: https://www.onetonline.org/link/summary/15-2051.00
