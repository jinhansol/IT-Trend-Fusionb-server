quiz:
  pass_score_percent: 80
  questions:
    - key: default-argument
      type: single
      prompt: |
        다음 코드의 출력은 무엇일까요?

        ```python
        def add(a, b=10):
            return a + b

        print(add(5))
        ```
      explanation: "`b`를 넘기지 않았으므로 기본값 10이 쓰여 5 + 10 = 15를 돌려줍니다."
      choices:
        - { key: a, label: "5" }
        - { key: b, label: "15", correct: true }
        - { key: c, label: "None" }
        - { key: d, label: "TypeError가 발생한다" }

    - key: no-return
      type: single
      prompt: |
        다음 코드에서 **마지막 줄**의 출력은 무엇일까요?

        ```python
        def hello():
            print("hi")

        result = hello()
        print(result)
        ```
      explanation: "`hello()`는 `hi`를 출력하지만 `return`이 없으므로 돌려주는 값은 `None`입니다."
      choices:
        - { key: a, label: "hi" }
        - { key: b, label: "None", correct: true }
        - { key: c, label: "아무것도 출력되지 않는다" }
        - { key: d, label: "NameError가 발생한다" }

    - key: local-variable
      type: single
      prompt: |
        다음 코드의 출력은 무엇일까요?

        ```python
        def plus_one(x):
            x = x + 1
            return x

        n = 5
        plus_one(n)
        print(n)
        ```
      explanation: "함수 안의 `x`는 지역 변수라 바깥의 `n`은 바뀌지 않습니다. 돌려준 6은 어디에도 담지 않았으므로 `n`은 그대로 5입니다."
      choices:
        - { key: a, label: "5", correct: true }
        - { key: b, label: "6" }
        - { key: c, label: "None" }
        - { key: d, label: "NameError가 발생한다" }

    - key: valid-calls
      type: multiple
      prompt: "`def area(width, height=1):`로 정의한 함수를 오류 없이 호출하는 것을 **모두** 고르세요."
      explanation: "`width`는 기본값이 없으니 반드시 넘겨야 합니다. 키워드 인자는 순서를 바꿔도 되지만, 위치 인자가 키워드 인자 뒤에 오면 `SyntaxError`입니다."
      choices:
        - { key: a, label: "area(3)", correct: true }
        - { key: b, label: "area(3, 4)", correct: true }
        - { key: c, label: "area(height=2, width=3)", correct: true }
        - { key: d, label: "area()" }
        - { key: e, label: "area(width=3, 4)" }

    - key: return-ends
      type: single
      prompt: |
        `check(-3)`의 결과는 무엇일까요?

        ```python
        def check(n):
            if n > 0:
                return "양수"
            return "0 또는 음수"
        ```
      explanation: "`-3 > 0`은 거짓이라 첫 `return`을 건너뛰고 두 번째 `return`이 실행됩니다. `n`이 양수였다면 첫 `return`에서 함수가 끝났을 것입니다."
      choices:
        - { key: a, label: "\"양수\"" }
        - { key: b, label: "\"0 또는 음수\"", correct: true }
        - { key: c, label: "\"양수\"와 \"0 또는 음수\" 둘 다" }
        - { key: d, label: "None" }
