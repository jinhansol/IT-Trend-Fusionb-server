activities:
  - slug: lists
    kind: reading
    title: 리스트
    required: true
    body_md: |
      **리스트**는 여러 값을 순서대로 담습니다. 대괄호 `[]` 안에 쉼표로 구분해 씁니다.

      ```python
      fruits = ["사과", "배", "귤"]
      print(fruits[0])    # 사과  (번호는 0부터 시작합니다)
      print(fruits[-1])   # 귤    (음수는 뒤에서부터 셉니다)
      print(len(fruits))  # 3
      ```

      ### 자주 쓰는 기능
      | 코드 | 결과 | 설명 |
      |---|---|---|
      | `fruits.append("감")` | 끝에 `"감"` 추가 | 리스트 자체가 바뀝니다 |
      | `fruits[1] = "포도"` | 1번 값을 바꿈 | 리스트는 바꿀 수 있습니다 |
      | `"배" in fruits` | `True` 또는 `False` | 들어 있는지 확인 |
      | `fruits[1:3]` | 1번부터 3번 직전까지 | 슬라이싱, 새 리스트를 만듭니다 |

      없는 번호를 꺼내면 `IndexError`가 납니다. 값이 3개인 리스트의 마지막 번호는 `2`입니다.

      `for`로 값을 하나씩 꺼낼 수 있습니다.

      ```python
      scores = [80, 95, 70]
      total = 0
      for s in scores:
          total = total + s
      print(total / len(scores))  # 81.66666666666667
      ```

  - slug: dicts
    kind: reading
    title: 딕셔너리
    required: true
    body_md: |
      **딕셔너리**는 키(key)와 값(value)을 짝지어 담습니다. 중괄호 `{}` 안에 `키: 값`으로 씁니다.
      번호 대신 **키로 값을 찾습니다.**

      ```python
      user = {"name": "민수", "age": 20}
      print(user["name"])      # 민수
      user["age"] = 21         # 있는 키는 값을 바꿉니다
      user["city"] = "서울"     # 없는 키는 새로 추가합니다
      print(user)  # {'name': '민수', 'age': 21, 'city': '서울'}
      ```

      ### 없는 키 다루기
      - `user["email"]`처럼 없는 키를 꺼내면 `KeyError`가 납니다.
      - `user.get("email")`은 오류 대신 `None`을, `user.get("email", "없음")`은 지정한 기본값을 돌려줍니다.
      - `"email" in user`로 키가 있는지 먼저 확인할 수도 있습니다.

      ### 반복하기
      ```python
      for key, value in user.items():
          print(key, value)
      # name 민수
      # age 21
      # city 서울
      ```

      한 딕셔너리 안에서 **키는 중복될 수 없습니다.** 같은 키에 다시 대입하면 값이 바뀝니다.

