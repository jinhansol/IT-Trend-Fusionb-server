  - slug: practice-word-count
    kind: exercise
    title: "직접 해보기: 점수표와 단어 세기"
    required: false
    body_md: |
      아래 두 프로그램을 완성해 보세요.

      ```python
      scores = [72, 88, 95, 64, 81]
      # 1. 80점 이상인 점수만 high 리스트에 담아 출력하세요. ([88, 95, 81])

      words = ["python", "java", "python", "go", "python"]
      counts = {}
      # 2. 단어별 등장 횟수를 counts에 담으세요. (힌트: counts.get(word, 0))
      #    {'python': 3, 'java': 1, 'go': 1}
      ```

# 초안 — 사용자 검토 전. 정답은 Python 3.12로 확인함.
quiz:
  pass_score_percent: 80
  questions:
    - key: negative-index
      type: single
      prompt: "`nums = [10, 20, 30, 40]`일 때 `nums[-1]`의 값은 무엇일까요?"
      explanation: "음수 번호는 뒤에서부터 셉니다. `-1`은 마지막 값인 40입니다."
      choices:
        - { key: a, label: "10" }
        - { key: b, label: "30" }
        - { key: c, label: "40", correct: true }
        - { key: d, label: "IndexError가 발생한다" }

    - key: slicing
      type: single
      prompt: "`nums = [10, 20, 30, 40]`일 때 `nums[1:3]`의 값은 무엇일까요?"
      explanation: "슬라이싱은 시작 번호부터 끝 번호 **직전**까지입니다. 1번(20)과 2번(30)이 담깁니다."
      choices:
        - { key: a, label: "[10, 20, 30]" }
        - { key: b, label: "[20, 30]", correct: true }
        - { key: c, label: "[20, 30, 40]" }
        - { key: d, label: "[10, 20]" }

    - key: missing-key
      type: single
      prompt: |
        다음 코드를 실행하면 어떻게 될까요?

        ```python
        user = {"name": "민수"}
        print(user["age"])
        ```
      explanation: "없는 키를 대괄호로 꺼내면 `KeyError`가 납니다. 오류 없이 확인하려면 `user.get(\"age\")`처럼 `get()`을 씁니다."
      choices:
        - { key: a, label: "None이 출력된다" }
        - { key: b, label: "0이 출력된다" }
        - { key: c, label: "KeyError가 발생한다", correct: true }
        - { key: d, label: "IndexError가 발생한다" }

    - key: list-after-append
      type: multiple
      prompt: "`fruits = [\"사과\", \"배\"]` 다음에 `fruits.append(\"귤\")`을 실행했습니다. 참인 것을 **모두** 고르세요."
      explanation: "`append()`는 끝에 값을 추가하므로 `[\"사과\", \"배\", \"귤\"]`이 됩니다. 길이는 3, 2번 값은 `\"귤\"`, 0번 값은 `\"사과\"`입니다."
      choices:
        - { key: a, label: "len(fruits) == 3", correct: true }
        - { key: b, label: "\"배\" in fruits", correct: true }
        - { key: c, label: "fruits[2] == \"귤\"", correct: true }
        - { key: d, label: "fruits[0] == \"배\"" }

    - key: update-and-add
      type: single
      prompt: |
        다음 코드의 출력은 무엇일까요?

        ```python
        stock = {"apple": 3}
        stock["apple"] = stock["apple"] + 2
        stock["pear"] = 1
        print(stock)
        ```
      explanation: "`apple`은 이미 있는 키라 값이 5로 바뀌고, `pear`는 없는 키라 새로 추가됩니다. 키는 중복되지 않습니다."
      choices:
        - { key: a, label: "{'apple': 3, 'pear': 1}" }
        - { key: b, label: "{'apple': 5, 'pear': 1}", correct: true }
        - { key: c, label: "{'apple': 3, 'apple': 5, 'pear': 1}" }
        - { key: d, label: "KeyError가 발생한다" }
