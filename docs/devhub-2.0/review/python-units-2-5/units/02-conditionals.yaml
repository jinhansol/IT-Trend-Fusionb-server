activities:
  - slug: comparison-and-logic
    kind: reading
    title: 비교 연산과 논리 연산
    required: true
    body_md: |
      조건문은 **참(`True`)인지 거짓(`False`)인지**에 따라 실행할 코드를 고릅니다.
      참과 거짓은 주로 비교 연산으로 만듭니다.

      | 연산자 | 뜻 | 예시 | 결과 |
      |---|---|---|---|
      | `==` | 같다 | `3 == 3` | `True` |
      | `!=` | 다르다 | `3 != 3` | `False` |
      | `<`, `>` | 작다, 크다 | `2 < 5` | `True` |
      | `<=`, `>=` | 작거나 같다, 크거나 같다 | `5 >= 5` | `True` |

      `=`는 대입이고 `==`는 비교입니다. 둘을 헷갈리지 않도록 주의하세요.

      ### 논리 연산자
      - `and`: 둘 다 참일 때만 참입니다. `age >= 13 and age < 20`
      - `or`: 하나라도 참이면 참입니다. `day == "토" or day == "일"`
      - `not`: 참과 거짓을 뒤집습니다. `not True`는 `False`입니다.

      ```python
      age = 15
      print(age >= 13 and age < 20)  # True
      print(13 <= age < 20)          # True (비교를 이어 쓸 수도 있습니다)
      print(not age > 10)            # False
      ```

      ### 참·거짓으로 쓰이는 값
      조건 자리에는 `bool`이 아닌 값도 올 수 있습니다. `0`, `0.0`, 빈 문자열 `""`은
      **거짓**으로, 그 밖의 숫자와 문자열은 참으로 취급됩니다. `"0"`과 `" "`(공백 한 칸)도
      비어 있지 않은 문자열이므로 참입니다.

  - slug: if-elif-else
    kind: reading
    title: if, elif, else
    required: true
    body_md: |
      `if` 뒤의 조건이 참이면 그 아래 **들여쓴 코드**를 실행합니다.
      줄 끝의 콜론(`:`)과 들여쓰기(보통 공백 4칸)가 문법의 일부입니다.

      ```python
      score = 85

      if score >= 90:
          grade = "A"
      elif score >= 80:
          grade = "B"
      elif score >= 70:
          grade = "C"
      else:
          grade = "F"

      print(grade)  # B
      ```

      ### 동작 순서
      - 위에서부터 조건을 하나씩 검사하고, **처음으로 참인 블록 하나만** 실행합니다.
      - 참인 블록을 실행하면 나머지 `elif`와 `else`는 건너뜁니다.
      - 모든 조건이 거짓일 때만 `else` 블록을 실행합니다. `elif`와 `else`는 없어도 됩니다.

      그래서 **조건의 순서**가 중요합니다. 위 예에서 `score >= 70`을 맨 위에 두면
      90점도 `"C"`가 됩니다.

      ```python
      n = 7
      if n % 2 == 0:
          print("짝수")
      else:
          print("홀수")  # 홀수
      ```

  - slug: official-tutorial
    kind: external
    title: "공식 튜토리얼: 제어 흐름 도구"
    url: https://docs.python.org/ko/3/tutorial/controlflow.html
    required: true
    body_md: |
