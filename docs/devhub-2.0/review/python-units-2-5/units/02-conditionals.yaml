      예제를 직접 실행해 보세요.

  - slug: practice-ticket-price
    kind: exercise
    title: "직접 해보기: 입장료 계산"
    required: false
    body_md: |
      나이에 따라 입장료를 정하는 프로그램을 완성해 보세요.

      ```python
      age = 15

      # 7세 미만: 0원, 7~18세: 5000원, 19~64세: 10000원, 65세 이상: 3000원
      # 1. if / elif / else로 price를 정하세요.
      # 2. "입장료: 5000원"처럼 출력하세요.
      ```

      `age`를 6, 7, 18, 19, 64, 65로 바꿔 가며 경계값이 맞는지 확인해 보세요.

# 초안 — 사용자 검토 전. 정답은 Python 3.12로 확인함.
quiz:
  pass_score_percent: 80
  questions:
    - key: elif-first-match
      type: single
      prompt: |
        다음 코드의 출력은 무엇일까요?

        ```python
        score = 85
        if score >= 90:
            print("A")
        elif score >= 80:
            print("B")
        elif score >= 70:
            print("C")
        else:
            print("F")
        ```
      explanation: "위에서부터 검사해 처음으로 참인 `score >= 80` 블록만 실행합니다. 85는 70 이상이기도 하지만 그 블록은 건너뜁니다."
      choices:
        - { key: a, label: "A" }
        - { key: b, label: "B", correct: true }
        - { key: c, label: "B와 C가 차례로 출력된다" }
        - { key: d, label: "F" }

    - key: assign-vs-compare
      type: single
      prompt: "`x = 5` 다음에 `if x = 5:`라고 쓰면 어떻게 될까요?"
      explanation: "조건에는 비교 연산자 `==`를 써야 합니다. `=`는 대입이므로 `if x = 5:`는 실행 전에 `SyntaxError`가 납니다."
      choices:
        - { key: a, label: "조건이 참이 되어 블록이 실행된다" }
        - { key: b, label: "x에 5가 다시 대입되고 블록은 건너뛴다" }
        - { key: c, label: "SyntaxError가 발생한다", correct: true }
        - { key: d, label: "TypeError가 발생한다" }

    - key: falsy-values
      type: multiple
      prompt: "조건 자리에서 **거짓**으로 취급되는 값을 **모두** 고르세요."
      explanation: "`0`, `0.0`, 빈 문자열 `\"\"`은 거짓입니다. `\"0\"`과 `\" \"`은 글자가 들어 있는 문자열이므로 참입니다."
      choices:
        - { key: a, label: "0", correct: true }
        - { key: b, label: "\"\"", correct: true }
        - { key: c, label: "\"0\"" }
        - { key: d, label: "0.0", correct: true }
        - { key: e, label: "\" \"" }

    - key: not-and
      type: single
      prompt: "`not (3 > 2 and 1 > 5)`의 결과는 무엇일까요?"
      explanation: "`3 > 2`는 참, `1 > 5`는 거짓이라 `and`의 결과는 `False`입니다. `not`이 이를 뒤집어 `True`가 됩니다."
      choices:
        - { key: a, label: "True", correct: true }
        - { key: b, label: "False" }
        - { key: c, label: "1" }
        - { key: d, label: "오류가 난다" }

    - key: condition-order
      type: single
      prompt: |
        다음 코드의 출력은 무엇일까요?

        ```python
        score = 95
        if score >= 60:
            print("D")
        elif score >= 90:
            print("A")
        else:
            print("F")
        ```
      explanation: "95는 첫 조건 `score >= 60`에서 이미 참이므로 `D`를 출력하고 나머지는 건너뜁니다. 넓은 조건을 먼저 쓰면 좁은 조건에 닿지 못합니다."
      choices:
        - { key: a, label: "A" }
        - { key: b, label: "D", correct: true }
        - { key: c, label: "D와 A가 차례로 출력된다" }
        - { key: d, label: "F" }
