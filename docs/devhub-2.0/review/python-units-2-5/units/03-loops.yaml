quiz:
  pass_score_percent: 80
  questions:
    - key: range-step
      type: single
      prompt: |
        다음 코드의 출력은 무엇일까요?

        ```python
        for i in range(2, 8, 2):
            print(i, end=" ")
        ```
      explanation: "`range(2, 8, 2)`는 2부터 8 직전까지 2씩 건너뛴 2, 4, 6을 만듭니다. 끝값 8은 포함되지 않습니다."
      choices:
        - { key: a, label: "2 4 6", correct: true }
        - { key: b, label: "2 4 6 8" }
        - { key: c, label: "2 3 4 5 6 7" }
        - { key: d, label: "4 6 8" }

    - key: range-count
      type: single
      prompt: "`for i in range(1, 10):` 안의 코드는 몇 번 실행될까요?"
      explanation: "`range(1, 10)`은 1부터 9까지이므로 9번 실행됩니다."
      choices:
        - { key: a, label: "8번" }
        - { key: b, label: "9번", correct: true }
        - { key: c, label: "10번" }
        - { key: d, label: "11번" }

    - key: while-result
      type: single
      prompt: |
        다음 코드의 출력은 무엇일까요?

        ```python
        n = 10
        while n > 0:
            n = n - 3
        print(n)
        ```
      explanation: "`n`은 10, 7, 4, 1을 거쳐 -2가 됩니다. -2가 되면 `n > 0`이 거짓이라 반복이 끝나고 -2를 출력합니다."
      choices:
        - { key: a, label: "1" }
        - { key: b, label: "0" }
        - { key: c, label: "-2", correct: true }
        - { key: d, label: "끝나지 않는다" }

    - key: break-continue
      type: single
      prompt: |
        다음 코드의 출력은 무엇일까요?

        ```python
        for i in range(1, 6):
            if i == 2:
                continue
            if i == 4:
                break
            print(i, end=" ")
        ```
      explanation: "1은 출력하고, 2는 `continue`로 건너뛰고, 3은 출력합니다. 4에서 `break`로 반복이 끝나므로 5는 실행되지 않습니다."
      choices:
        - { key: a, label: "1 3", correct: true }
        - { key: b, label: "1 3 5" }
        - { key: c, label: "1 2 3" }
        - { key: d, label: "1 3 4" }

    - key: three-lines
      type: multiple
      prompt: "본문에 `print()` 한 줄만 있을 때, 정확히 **3번** 출력하는 반복문을 **모두** 고르세요."
      explanation: "`range(0, 6, 2)`는 0, 2, 4이고 `\"abc\"`는 글자가 3개라 3번입니다. `range(1, 3)`은 1, 2로 2번이고, `range(3, 0)`은 간격이 양수라 값이 없어 한 번도 실행되지 않습니다."
      choices:
        - { key: a, label: "for i in range(0, 6, 2):", correct: true }
        - { key: b, label: "for ch in \"abc\":", correct: true }
        - { key: c, label: "for i in range(1, 3):" }
        - { key: d, label: "for i in range(3, 0):" }
