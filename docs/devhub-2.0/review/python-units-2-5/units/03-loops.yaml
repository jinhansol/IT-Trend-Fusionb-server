activities:
  - slug: for-and-range
    kind: reading
    title: for와 range()
    required: true
    body_md: |
      `for`는 여러 값을 **하나씩 꺼내** 같은 코드를 반복합니다.
      정해진 횟수만큼 반복할 때는 `range()`를 함께 씁니다.

      ```python
      for i in range(3):
          print("안녕", i)
      # 안녕 0
      # 안녕 1
      # 안녕 2
      ```

      | 표현 | 만드는 값 | 설명 |
      |---|---|---|
      | `range(5)` | 0, 1, 2, 3, 4 | 0부터 5 **직전**까지 |
      | `range(1, 6)` | 1, 2, 3, 4, 5 | 시작값부터 끝값 직전까지 |
      | `range(0, 10, 3)` | 0, 3, 6, 9 | 세 번째 값은 간격 |
      | `range(5, 0, -1)` | 5, 4, 3, 2, 1 | 간격이 음수면 거꾸로 |

      끝값은 **포함되지 않습니다.** `range(1, 6)`처럼 끝값을 하나 크게 써야 5까지 나옵니다.

      문자열도 한 글자씩 꺼낼 수 있습니다.

      ```python
      total = 0
      for ch in "2026":
          total = total + int(ch)
      print(total)  # 10
      ```

  - slug: while-break-continue
    kind: reading
    title: while, break, continue
    required: true
    body_md: |
      `while`은 조건이 **참인 동안** 반복합니다. 몇 번 반복할지 미리 모를 때 씁니다.

      ```python
      money = 10000
      count = 0
      while money >= 3000:
          money = money - 3000
          count = count + 1
      print(count, money)  # 3 1000
      ```

      반복 안에서 조건에 쓰인 값이 바뀌지 않으면 **끝나지 않는 반복**이 됩니다.
      실행이 멈추지 않으면 `Ctrl+C`로 중단하세요.

      ### break와 continue
      - `break`: 반복을 **즉시 끝내고** 반복문 다음 줄로 갑니다.
      - `continue`: 이번 회차의 나머지를 건너뛰고 **다음 회차**로 갑니다.

      ```python
      for n in range(1, 10):
          if n % 2 == 0:
              continue      # 짝수는 건너뜁니다
          if n > 5:
              break         # 5보다 큰 홀수를 만나면 끝냅니다
          print(n)
      # 1
      # 3
      # 5
      ```

