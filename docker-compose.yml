# Local development infrastructure for DevHub 2.0.
#   docker compose up -d --wait mariadb
#
# Creates two isolated databases with separate accounts:
#   devhub_dev  / user devhub_dev   -> local development
#   devhub_test / user devhub_test  -> automated tests (can only see devhub_test)
# Credentials below are local-only defaults; override them in a root .env file.
# Port 3307 on 127.0.0.1 avoids clashing with any MariaDB/MySQL already on 3306.
name: devhub

services:
  mariadb:
    image: mariadb:11.4.13
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DEVHUB_DB_ROOT_PASSWORD:-devhub_local_root}
      DEVHUB_DEV_PASSWORD: ${DEVHUB_DEV_PASSWORD:-devhub_local_dev}
      DEVHUB_TEST_PASSWORD: ${DEVHUB_TEST_PASSWORD:-devhub_local_test}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_uca1400_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:${DEVHUB_DB_PORT:-3307}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  mariadb_data:
