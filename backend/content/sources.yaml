  - { slug: kurly-tech, name: 컬리 기술 블로그, kind: blog, adapter: rss, language: ko, site_url: "https://helloworld.kurly.com/", feed_url: "https://helloworld.kurly.com/rss.xml", channel: kr-techblog, channel_name: 국내 기술블로그, max_items: 10, status: paused }
