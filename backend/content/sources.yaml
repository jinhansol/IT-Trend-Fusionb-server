# Where the collector reads content. Only official APIs and RSS/Atom feeds.
# Full articles are never stored: title, short description, link, author, dates
# and the metrics a source provides.
#
# kind      news | blog | community | qna
# adapter   rss | devto | hackernews | stackoverflow
# channel   Dev screen tab (required except for news). Sources sharing a channel share
#           its name and either all have metrics (API) or are all feeds (rss).
# status    active | paused  (sources removed from this file are retired)
#
# DevHub 2.0 collects Korean IT news and Korean developer blogs only; overseas sources
# and English->Korean translation were dropped (sources removed here are retired, their
# rows kept).
#
# options.terms   unverified (default) | approved. A working feed is not a licence:
#                 `collect` saves only active sources with terms: approved, and scheduled
#                 collection (content/collect-schedule.yaml) needs the same. Unverified
#                 sources can still be checked read-only: python -m app.jobs diagnose
# options.excerpt true stores and shows the feed's description (needs terms: approved);
#                 otherwise it is used for tagging only and a card is title, source, date
#                 and link. ai_summary is a third, separate permission (also needs
#                 terms: approved); approved terms alone allow neither.
# No source below has its terms approved yet (2026-11-03): see
# docs/devhub-2.0/DevHub-2.0-Korean-RSS-Supply.md for the checks and what is missing.
#
# Feeds checked 2026-11-03 with the collector's fetcher and parser (robots.txt first).
# New candidates are paused until their terms are checked. A dead feed only fails its
# own run (see job_runs).
#
# Load: uv run python -m app.content_loader sources content/sources.yaml

sources:
  # --- Home: Korean IT news ----------------------------------------------------------------
  - { slug: zdnet-korea, name: ZDNet Korea, kind: news, adapter: rss, language: ko, site_url: "https://zdnet.co.kr/", feed_url: "https://feeds.feedburner.com/zdkorea" }
  # The SW section (04). Section903 was "most read" (horoscopes, entertainment).
  - { slug: etnews, name: 전자신문, kind: news, adapter: rss, language: ko, site_url: "https://www.etnews.com/", feed_url: "https://rss.etnews.com/04.xml" }
  # robots.txt disallows /feed/ for every crawler (and AI bots site-wide); not collected.
  - { slug: itworld-korea, name: ITWorld Korea, kind: news, adapter: rss, language: ko, site_url: "https://www.itworld.co.kr/", feed_url: "https://www.itworld.co.kr/feed/", status: paused }
  # The old address redirects to cio.com and answers 404; robots.txt disallows the
  # Korean /kr/feed/ path. Not collected.
  - { slug: ciokorea, name: CIO Korea, kind: news, adapter: rss, language: ko, site_url: "https://www.ciokorea.com/", feed_url: "https://www.ciokorea.com/rss/all.xml", status: paused }
  # No working feed found: this address redirects to the home page, the site lists none.
  - { slug: ddaily, name: 디지털데일리, kind: news, adapter: rss, language: ko, site_url: "https://www.ddaily.co.kr/", feed_url: "https://www.ddaily.co.kr/news/rss/allArticle.xml", status: paused }
  # bloter.net/rss redirects to plain http; the CDN serves the same feed over https.
  - { slug: bloter, name: 블로터, kind: news, adapter: rss, language: ko, site_url: "https://www.bloter.net/", feed_url: "https://cdn.bloter.net/rss/gns_allArticle.xml" }
  - { slug: boannews, name: 보안뉴스, kind: news, adapter: rss, language: ko, site_url: "https://www.boannews.com/", feed_url: "https://www.boannews.com/rss/allArticle.xml" }
  # Candidates (feeds parse; terms not checked yet).
  - { slug: aitimes, name: AI타임스, kind: news, adapter: rss, language: ko, site_url: "https://www.aitimes.com/", feed_url: "https://www.aitimes.com/rss/allArticle.xml", status: paused }
  # KISA security advisories: title, date and link only (the feed has no description).
  - { slug: boho-notice, name: 보호나라 보안공지, kind: news, adapter: rss, language: ko, site_url: "https://www.boho.or.kr/", feed_url: "https://www.boho.or.kr/kr/rss.do?bbsId=B0000133", status: paused }

  # --- Dev: Korean developer community -----------------------------------------------------
  - slug: geeknews
    name: GeekNews
    kind: community
    adapter: rss
    language: ko
    site_url: "https://news.hada.io/"
    feed_url: "https://feeds.feedburner.com/geeknews-feed"
    channel: geeknews
    channel_name: GeekNews

  # --- Dev: Korean company tech blogs (one tab) --------------------------------------------
