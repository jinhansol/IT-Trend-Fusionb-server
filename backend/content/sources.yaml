# Where the collector reads content. Only official APIs and RSS/Atom feeds.
# Full articles are never stored: title, short description, link, author, dates
# and the metrics a source provides.
#
# kind      news | blog | community | qna
# adapter   rss | devto | hackernews | stackoverflow
# channel   Dev screen tab (required except for news). Sources sharing a channel share
#           its name and either all have metrics (API) or are all feeds (rss).
# status    active | paused  (sources removed from this file are retired)
#
# DevHub 2.0 collects Korean IT news and Korean developer blogs only; overseas sources
# and English->Korean translation were dropped (sources removed here are retired, their
# rows kept). A working feed is not a licence: scheduled collection takes only sources
# listed in content/collect-schedule.yaml, once their terms are checked.
#
# Feed addresses carried over from v1 have not all been checked from this environment.
# Checked 2026-11-02: itworld-korea and zdnet-korea (new feed addresses below), geeknews,
# kakao-tech, lycorp-tech. A dead feed only fails its own run (see job_runs).
#
# Load: uv run python -m app.content_loader sources content/sources.yaml

sources:
  # --- Home: Korean IT news ----------------------------------------------------------------
  - { slug: zdnet-korea, name: ZDNet Korea, kind: news, adapter: rss, language: ko, site_url: "https://zdnet.co.kr/", feed_url: "https://feeds.feedburner.com/zdkorea" }
  - { slug: etnews, name: 전자신문, kind: news, adapter: rss, language: ko, site_url: "https://www.etnews.com/", feed_url: "https://rss.etnews.com/Section903.xml" }
  # robots.txt disallows /feed/ for every crawler (and AI bots site-wide); not collected.
  - { slug: itworld-korea, name: ITWorld Korea, kind: news, adapter: rss, language: ko, site_url: "https://www.itworld.co.kr/", feed_url: "https://www.itworld.co.kr/feed/", status: paused }
  - { slug: ciokorea, name: CIO Korea, kind: news, adapter: rss, language: ko, site_url: "https://www.ciokorea.com/", feed_url: "https://www.ciokorea.com/rss/all.xml" }
  - { slug: ddaily, name: 디지털데일리, kind: news, adapter: rss, language: ko, site_url: "https://www.ddaily.co.kr/", feed_url: "https://www.ddaily.co.kr/news/rss/allArticle.xml" }
  - { slug: bloter, name: 블로터, kind: news, adapter: rss, language: ko, site_url: "https://www.bloter.net/", feed_url: "https://www.bloter.net/rss" }
  - { slug: boannews, name: 보안뉴스, kind: news, adapter: rss, language: ko, site_url: "https://www.boannews.com/", feed_url: "https://www.boannews.com/media/rss.xml" }

  # --- Dev: Korean developer community -----------------------------------------------------
  - slug: geeknews
    name: GeekNews
    kind: community
    adapter: rss
    language: ko
    site_url: "https://news.hada.io/"
    feed_url: "https://feeds.feedburner.com/geeknews-feed"
    channel: geeknews
    channel_name: GeekNews

  # --- Dev: Korean company tech blogs (one tab) --------------------------------------------
  - { slug: toss-tech, name: 토스 기술 블로그, kind: blog, adapter: rss, language: ko, site_url: "https://toss.tech/", feed_url: "https://toss.tech/rss.xml", channel: kr-techblog, channel_name: 국내 기술블로그, max_items: 10 }
  # The site answers automated requests with 403 (Cloudflare); not collected, never worked around.
  - { slug: woowahan-tech, name: 우아한형제들 기술 블로그, kind: blog, adapter: rss, language: ko, site_url: "https://techblog.woowahan.com/", feed_url: "https://techblog.woowahan.com/feed/", channel: kr-techblog, channel_name: 국내 기술블로그, max_items: 10, status: paused }
  - { slug: kakao-tech, name: 카카오 기술 블로그, kind: blog, adapter: rss, language: ko, site_url: "https://tech.kakao.com/", feed_url: "https://tech.kakao.com/feed/", channel: kr-techblog, channel_name: 국내 기술블로그, max_items: 10 }
  - { slug: naver-d2, name: NAVER D2, kind: blog, adapter: rss, language: ko, site_url: "https://d2.naver.com/", feed_url: "https://d2.naver.com/d2.atom", channel: kr-techblog, channel_name: 국내 기술블로그, max_items: 10 }
  - { slug: daangn-tech, name: 당근 테크 블로그, kind: blog, adapter: rss, language: ko, site_url: "https://medium.com/daangn", feed_url: "https://medium.com/feed/daangn", channel: kr-techblog, channel_name: 국내 기술블로그, max_items: 10 }
  - { slug: kakaopay-tech, name: 카카오페이 기술 블로그, kind: blog, adapter: rss, language: ko, site_url: "https://tech.kakaopay.com/", feed_url: "https://tech.kakaopay.com/rss", channel: kr-techblog, channel_name: 국내 기술블로그, max_items: 10 }
  - { slug: lycorp-tech, name: LY Corporation Tech Blog, kind: blog, adapter: rss, language: ko, site_url: "https://techblog.lycorp.co.jp/ko", feed_url: "https://techblog.lycorp.co.jp/ko/feed/index.xml", channel: kr-techblog, channel_name: 국내 기술블로그, max_items: 10 }
