# 초안 — 사용자 검토 전. 퀴즈는 Phase 4에서 추가합니다.
slug: variables-and-types
position: 1
title: 변수와 기본 자료형
summary: >-
  값을 이름에 담는 변수, 그리고 Python이 다루는 기본 자료형(int, float, str, bool)을 배웁니다.
estimated_minutes: 40
status: published

activities:
  - slug: variables
    kind: reading
    title: 변수와 대입
    required: true
    body_md: |
      **변수**는 값에 붙이는 이름입니다. `=` 기호로 값을 이름에 연결하는 것을 **대입**이라고 합니다.

      ```python
      age = 20
      name = "DevHub"
      age = age + 1   # 오른쪽을 먼저 계산한 뒤 다시 age에 대입합니다
      print(name, age)  # DevHub 21
      ```

      `=`는 수학의 "같다"가 아니라 "오른쪽 값을 왼쪽 이름에 담는다"는 뜻입니다.

      ### 이름 규칙
      - 영문자, 숫자, 밑줄(`_`)을 쓸 수 있고 **숫자로 시작할 수 없습니다** (`1st`는 불가, `first`는 가능).
      - 대소문자를 구분합니다. `score`와 `Score`는 서로 다른 변수입니다.
      - `if`, `for`, `class` 같은 **예약어**는 이름으로 쓸 수 없습니다.
      - 관례상 여러 단어는 밑줄로 잇습니다: `user_name`, `total_price`.

  - slug: basic-types
    kind: reading
    title: "기본 자료형: int, float, str, bool"
    required: true
    body_md: |
      모든 값에는 **자료형**(type)이 있습니다. `type()` 함수로 확인할 수 있습니다.

      | 자료형 | 의미 | 예시 |
      |---|---|---|
      | `int` | 정수 | `42`, `-7` |
      | `float` | 실수(소수점) | `3.14`, `0.5` |
      | `str` | 문자열 | `"hello"`, `'파이썬'` |
      | `bool` | 참/거짓 | `True`, `False` |

      ```python
      print(type(42))      # <class 'int'>
      print(type(3.14))    # <class 'float'>
      print(type("hi"))    # <class 'str'>
      print(type(1 < 2))   # <class 'bool'>
      ```

      ### 알아둘 점
      - `/` 나눗셈의 결과는 항상 `float`입니다: `7 / 2`는 `3.5`, `4 / 2`는 `2.0`.
      - 정수 몫은 `//`, 나머지는 `%`를 씁니다: `7 // 2`는 `3`, `7 % 2`는 `1`.
      - 문자열과 숫자는 바로 더할 수 없습니다. `"나이: " + 20`은 오류이고, `"나이: " + str(20)`처럼 바꿔야 합니다.
      - `int("123")`, `float("1.5")`, `str(10)`처럼 자료형을 변환할 수 있습니다. `int("1.5")`는 오류입니다.

  - slug: official-tutorial
    kind: external
    title: "공식 튜토리얼: 파이썬을 계산기로 사용하기"
    url: https://docs.python.org/ko/3/tutorial/introduction.html
    required: true
    body_md: |
      Python 공식 튜토리얼(한국어)의 3장입니다. "숫자"와 "텍스트" 절을 읽으며
      예제를 직접 실행해 보세요.

  - slug: practice-calculator
    kind: exercise
    title: "직접 해보기: 간단한 계산 프로그램"
    required: false
    body_md: |
      아래 프로그램을 완성해 보세요.

      ```python
      price = 12000      # 상품 가격 (원)
      quantity = 3       # 수량
      discount = 0.1     # 할인율 10%

      # 1. 총 금액(price × quantity)을 total에 담으세요.
      # 2. 할인된 금액을 final_price에 담으세요.
      # 3. "결제 금액: 32400원"처럼 출력하세요. (힌트: int(), str())
      ```

      다 했다면 `type(final_price)`가 무엇인지, 왜 그런지 생각해 보세요.

# 초안 — 사용자 검토 전. 정답은 Python 3.12로 확인함.
quiz:
  pass_score_percent: 80
  questions:
    - key: true-division
      type: single
      prompt: "`7 / 2`의 결과는 무엇일까요?"
      explanation: "`/` 나눗셈의 결과는 항상 `float`입니다. 정수 몫이 필요하면 `//`를 씁니다."
      choices:
        - { key: a, label: "3" }
        - { key: b, label: "3.5", correct: true }
        - { key: c, label: "4" }
        - { key: d, label: "오류가 난다" }

    - key: invalid-name
      type: single
      prompt: "변수 이름으로 **쓸 수 없는** 것은 무엇일까요?"
      explanation: "변수 이름은 숫자로 시작할 수 없습니다. 밑줄(`_`)로는 시작할 수 있습니다."
      choices:
        - { key: a, label: "user_name" }
        - { key: b, label: "_count" }
        - { key: c, label: "2nd_place", correct: true }
        - { key: d, label: "total2" }

    - key: int-results
      type: multiple
      prompt: "결과의 자료형이 `int`인 것을 **모두** 고르세요."
      explanation: "`//`의 결과와 `int()`로 변환한 값은 `int`입니다. `/`의 결과와, 실수가 섞인 계산은 `float`입니다."
      choices:
        - { key: a, label: "7 // 2", correct: true }
        - { key: b, label: "4 / 2" }
        - { key: c, label: "int(\"42\")", correct: true }
        - { key: d, label: "3 * 1.0" }

    - key: str-plus-int
      type: single
      prompt: "`\"나이: \" + 20`을 실행하면 어떻게 될까요?"
      explanation: "문자열과 숫자는 `+`로 바로 이을 수 없어 `TypeError`가 납니다. `\"나이: \" + str(20)`처럼 바꿔야 합니다."
      choices:
        - { key: a, label: "\"나이: 20\"이 된다" }
        - { key: b, label: "TypeError가 발생한다", correct: true }
        - { key: c, label: "SyntaxError가 발생한다" }
        - { key: d, label: "\"나이: \"만 남는다" }

    - key: bool-type
      type: single
      prompt: |
        다음 코드의 출력은 무엇일까요?

        ```python
        x = 5
        x = x * 2
        print(type(x > 8))
        ```
      explanation: "`x`는 10이 되고, `x > 8`은 비교 결과인 `True`이므로 자료형은 `bool`입니다."
      choices:
        - { key: a, label: "<class 'int'>" }
        - { key: b, label: "<class 'bool'>", correct: true }
        - { key: c, label: "True" }
        - { key: d, label: "10" }
