  - slug: practice-calculator
    kind: exercise
    title: "직접 해보기: 간단한 계산 프로그램"
    required: false
    body_md: |
      아래 프로그램을 완성해 보세요.

      ```python
      price = 12000      # 상품 가격 (원)
      quantity = 3       # 수량
      discount = 0.1     # 할인율 10%

      # 1. 총 금액(price × quantity)을 total에 담으세요.
      # 2. 할인된 금액을 final_price에 담으세요.
      # 3. "결제 금액: 32400원"처럼 출력하세요. (힌트: int(), str())
      ```

      다 했다면 `type(final_price)`가 무엇인지, 왜 그런지 생각해 보세요.
