# Scheduled collection (python -m app.jobs collect --group news|dev).
# Trial values, not tuned: change hours here, then re-render the crontab with
#   uv run python -m app.jobs crontab
# Only the sources listed are collected on schedule; anything else is collected by hand.
# A source is listed only once its terms allow collecting and showing it again
# (docs/devhub-2.0/DevHub-2.0-E0-Source-Terms-Review.md). AI translation and summaries
# never run on schedule.
timezone: Asia/Seoul
groups:
  news:
    minute: 0
    hours: [2, 14]
    # No source yet: Korean news terms are not reviewed (itworld-korea and zdnet-korea
    # parse). ZDNet's feed lists only its latest 30 items (a few hours of news), so 12-hour
    # runs would miss articles; give it its own shorter interval if it is ever listed.
    sources: []
  dev:
    minute: 0
    hours: [5, 11, 17, 23]
    # No source yet: Korean blogs' reuse terms are not confirmed (kakao-tech, lycorp-tech
    # parse; woowahan-tech blocks automated access). web.dev was dropped with overseas sources.
    sources: []
