# Scheduled collection (python -m app.jobs collect --group news|dev).
# Trial values, not tuned: change hours here, then re-render the crontab with
#   uv run python -m app.jobs crontab
# Only the sources listed are collected on schedule (`collect --source` by hand saves only
# terms-approved sources as well).
# A source runs on schedule only when it is listed here AND is active with
# options.terms: approved in content/sources.yaml (app/jobs/schedule.py checks both).
# No source's terms are approved yet (docs/devhub-2.0/DevHub-2.0-Korean-RSS-Supply.md).
# AI translation and summaries never run on schedule.
timezone: Asia/Seoul
groups:
  news:
    minute: 0
    hours: [2, 14]
    # No source yet. Measured 2026-11-03 (python -m app.jobs diagnose): most news feeds
    # list 19-24 hours of articles, enough for 12-hour runs, but ZDNet's 30 items cover
    # about 14 hours, so it would lose articles on busy days; it needs runs every 6 hours
    # if it is ever listed.
    sources: []
  dev:
    minute: 0
    hours: [5, 11, 17, 23]
    # No source yet. GeekNews lists only its latest 20 items (about 8 hours): every 3-4
    # hours would be safe, 6 hours is tight. Company blogs post a few times a month and
    # their feeds cover weeks, so once or twice a day would be enough for them.
    sources: []
