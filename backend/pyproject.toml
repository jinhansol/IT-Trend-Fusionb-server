[project]
name = "devhub-backend"
version = "2.0.0.dev0"
description = "DevHub 2.0 backend (FastAPI + MariaDB)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0.35,<2.1",
    "pymysql>=1.1",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "pyjwt>=2.15.1",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
]
jobs = [
    "feedparser>=6.0.11",
    "google-genai>=2.34.0",
    "httpx>=0.27",
]

[tool.uv]
# The legacy modules under backend/ are not a package; only app/ is ours.
package = false
# Collector-only libraries live in the "jobs" group so a web-only image can skip them
# (uv sync --no-group jobs). Development and CI install both.
default-groups = ["dev", "jobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: requires the MariaDB test database (docker compose)",
]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["app/**/*.py", "tests/**/*.py", "alembic/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# backend/alembic/ is the migrations folder, not the alembic package.
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
